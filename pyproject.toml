[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zarqa"
version = "0.1.0b0"
description = "Open-source, AI-powered threat intelligence tool (beta)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ares-369" }]
keywords = ["security", "threat-intelligence", "cti", "osint", "stix", "mcp", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
]
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/ares-369/zarqa"
Repository = "https://github.com/ares-369/zarqa"
Documentation = "https://github.com/ares-369/zarqa/tree/main/docs"
Issues = "https://github.com/ares-369/zarqa/issues"
Changelog = "https://github.com/ares-369/zarqa/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=0.3"]
openai = ["openai>=1.40"]
oidc = ["authlib>=1.3"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
all = ["anthropic>=0.40", "google-genai>=0.3", "openai>=1.40", "authlib>=1.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
zarqa = "zarqa.cli:cli_main"

[tool.setuptools.packages.find]
include = ["zarqa*"]

[tool.setuptools.package-data]
zarqa = ["templates/*.html", "static/**/*", "config.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM105", "SIM108", "RUF012"]
