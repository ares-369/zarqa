# docker compose up -d   ->  http://127.0.0.1:8621
# Config and data live in ./zarqa-data (config.yaml, .env, databases). Edit them there.
services:
  zarqa:
    build: .
    image: zarqa:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8621:8621"     # loopback only; put a reverse proxy with login in front for remote use
    volumes:
      - ./zarqa-data:/data
    env_file:
      - path: ./zarqa-data/.env
        required: false
    environment:
      # Listening on 0.0.0.0 inside the container is needed for the port mapping.
      # The port is still only published on the host's loopback (above).
      ZARQA_ALLOW_UNAUTHENTICATED_NETWORK: "true"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
